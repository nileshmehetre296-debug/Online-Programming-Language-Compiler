services:
  app:
    image: compiler-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      # Mount the application code from the host to the container
      - "./:/app"
      # Ensure node_modules inside the container is not overridden
      - "/app/node_modules"
    env_file:
      - .env.development
    command: npm run dev
