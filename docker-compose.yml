services:
  frontend:
    image: online-compiler-frontend
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    ports:
      - "80:80" 
    env_file:
      - ./frontend/.env  

  backend:
    image: online-compiler-backend
    build:
      context: ./backend 
      dockerfile: Dockerfile
    ports:
      - "3000:3000" 
    volumes:
      - code_volume:/app/code       # Use the named volume 'code_volume' mounted to /code
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket
    env_file:
      - ./backend/.env

volumes:
  code_volume:  
    name: code_volume